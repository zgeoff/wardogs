[install]
# pnpm-style symlinked node_modules: no phantom dependencies
linker = "isolated"

# bun add saves exact versions, no ^/~ ranges
exact = true

# supply-chain guard: only install versions published at least 7 days ago
minimumReleaseAge = 604800

# first-party packages from zgeoff/tools skip the wait; drop each one here once its pinned
# version is older than 7 days
minimumReleaseAgeExcludes = [
  "@zgeoff/bun-test-react",
  "@zgeoff/commitlint-config",
  "@zgeoff/oxfmt-config",
  "@zgeoff/tsconfig",
]

[test]
preload = ["@zgeoff/bun-test-extended"]
