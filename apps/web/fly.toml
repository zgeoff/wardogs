# Deployed from the repo root by .github/workflows/main.yml:
# flyctl deploy --remote-only --config apps/web/fly.toml --dockerfile apps/web/Dockerfile
app = 'wardogs-love'
primary_region = 'syd'

[deploy]
# bluegreen and canary cannot run with a volume attached
strategy = 'rolling'

# the share-link database lives on a volume, so the app runs as one machine
[env]
DATABASE_PATH = '/data/wardogs.db'

[mounts]
source = 'wardogs_data'
destination = '/data'

[http_service]
internal_port = 3000
force_https = true
auto_stop_machines = 'suspend'
auto_start_machines = true
min_machines_running = 0

[[http_service.checks]]
grace_period = '5s'
interval = '15s'
method = 'GET'
path = '/health'
timeout = '2s'

[[vm]]
memory = '256mb'
cpu_kind = 'shared'
cpus = 1
